<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK Hub · 本机作品汇总</title>
<meta name="description" content="本机各会话产出的 Android APK 汇总下载站">
<style>
  :root{
    --bg:#10141c; --panel:#181e29; --line:#2a3345; --ink:#f2efe6; --dim:#9aa4b5;
    --brass:#d4a24a; --teal:#3f8f8a; --red:#a83c2c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#141a26 0%,#10141c 40%,#0c1116 100%);
       color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{max-width:860px;margin:0 auto;padding:34px 20px 10px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:.06em}
  h1 span{color:var(--brass)}
  .sub{color:var(--dim);font-size:13px}
  main{max-width:860px;margin:0 auto;padding:14px 20px 60px;display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
        display:grid;grid-template-columns:112px 1fr;gap:16px}
  .qr{background:#fff;border-radius:10px;padding:6px;width:112px;height:112px;display:flex;
      align-items:center;justify-content:center}
  .qr canvas,.qr img{width:100%!important;height:100%!important}
  .name{font-size:19px;font-weight:600;margin:0 0 2px}
  .meta{color:var(--dim);font-size:12.5px;margin:2px 0 8px;word-break:break-all}
  .desc{font-size:14px;margin:0 0 12px;color:#d8dce4}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  a.btn{display:inline-block;background:var(--brass);color:#1b1408;text-decoration:none;font-weight:600;
        border-radius:10px;padding:10px 18px;font-size:15px}
  a.btn.alt{background:transparent;color:var(--brass);border:1px solid var(--brass)}
  .tag{font-size:11px;color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:2px 9px}
  .sha{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  footer{max-width:860px;margin:0 auto;padding:0 20px 40px;color:var(--dim);font-size:12px}
  @media (max-width:560px){.card{grid-template-columns:1fr}.qr{margin:0 auto}}
</style>
</head>
<body>
<header>
  <h1>APK <span>HUB</span></h1>
  <div class="sub">本机各会话产出的 Android 安装包 · 扫码或点击直接下载 · 数据源 manifest.json</div>
</header>
<main id="list"><div class="sub">加载中…</div></main>
<footer id="foot"></footer>
<script src="vendor/qrcode.min.js"></script>
<script>
function fmtSize(b){if(b>1048576)return (b/1048576).toFixed(1)+' MB';if(b>1024)return (b/1024).toFixed(1)+' KB';return b+' B'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){
  let m;
  try{
    const r = await fetch('apks/manifest.json?t='+Date.now(), {cache:'no-store'});
    m = await r.json();
  }catch(e){
    try{ const r2 = await fetch('/api/apps'); m = await r2.json(); }
    catch(e2){ document.getElementById('list').innerHTML = '<div class="sub">manifest 加载失败：'+esc(e2)+'</div>'; return; }
  }
  const apps = m.apps || [];
  const el = document.getElementById('list');
  if(!apps.length){ el.innerHTML = '<div class="sub">暂无 APK。用 tools/add_apk.py 添加后 push 即上线。</div>'; }
  el.innerHTML = '';
  for(const a of apps){
    const card = document.createElement('section');
    card.className = 'card';
    const extras = (a.extra_files||[]).map(f=>'<a class="btn alt" href="'+esc(f.file)+'">'+esc(f.label||f.file)+'</a>').join('');
    card.innerHTML =
      '<div class="qr" data-url=""></div>'+
      '<div><h2 class="name">'+esc(a.name)+'</h2>'+
      '<div class="meta">v'+esc(a.version)+' · '+esc(a.abi||'')+' · '+fmtSize(a.size)+' · 添加于 '+esc(a.added||'')+
        (a.engine?' · '+esc(a.engine):'')+(a.min_sdk?' · minSdk '+esc(a.min_sdk):'')+'</div>'+
      '<p class="desc">'+esc(a.desc||'')+'</p>'+
      '<div class="row"><a class="btn" href="'+esc(a.file)+'">下载 APK</a>'+extras+
        (a.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'+
      '<div class="meta sha">sha256 '+esc(a.sha256||'')+'</div></div>';
    el.appendChild(card);
    const url = new URL(a.file, location.href).href;
    card.querySelector('.qr').dataset.url = url;
    if(window.QRCode){ new QRCode(card.querySelector('.qr'), {text:url, width:100, height:100, correctLevel:QRCode.CorrectLevel.M}); }
  }
  document.getElementById('foot').textContent =
    '更新：' + (m.updated||'') + ' · 共 ' + apps.length + ' 个应用 · 接口：GET /api/apps';
}
load();
</script>
</body>
</html>
